name: Health Check

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          BACKEND_HEALTHCHECK_URL: ${{ secrets.BACKEND_HEALTHCHECK_URL }}
        run: |
          if [ -z "$BACKEND_HEALTHCHECK_URL" ]; then
            echo "BACKEND_HEALTHCHECK_URL is not set"
            exit 1
          fi

          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 30 "$BACKEND_HEALTHCHECK_URL"; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Health check attempt $attempt failed, retrying in 15 seconds..."
              sleep 15
            fi
          done

          echo "Health check failed after 3 attempts"
          exit 1