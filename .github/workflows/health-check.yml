name: Health Check

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health endpoint
        env:
          BACKEND_HEALTHCHECK_URL: ${{ secrets.BACKEND_HEALTHCHECK_URL }}
        run: |
          if [ -z "$BACKEND_HEALTHCHECK_URL" ]; then
            echo "BACKEND_HEALTHCHECK_URL is not set"
            exit 1
          fi

          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 90 \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 10 \
            "$BACKEND_HEALTHCHECK_URL"